name: AKASHA Web CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the application without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: app
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify the exact proposed source revision
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git show -s --format='qualified_commit=%H%nqualified_tree=%T' HEAD
      - name: Select the fixed Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: Verify private dependency setup guards offline
        run: node --test scripts/bootstrap-shared-packages.test.mjs scripts/install-private-dependencies.test.mjs
      - name: Read the immutable shared package revision
        id: shared
        run: node scripts/bootstrap-shared-packages.mjs --github-output
      - name: Check required private read credentials
        env:
          PACKAGE_SOURCE_KEY_PRESENT: ${{ secrets.PURAMA_PACKAGES_READ_SSH_KEY != '' }}
          SMARANA_KEY_PRESENT: ${{ secrets.SMARANA_READ_SSH_KEY != '' }}
        run: |
          if [ "$PACKAGE_SOURCE_KEY_PRESENT" != true ]; then
            echo '::error::A dedicated read-only PURAMA_PACKAGES_READ_SSH_KEY is required for purama-master.'
            exit 1
          fi
          if [ "$SMARANA_KEY_PRESENT" != true ]; then
            echo '::error::A separate read-only SMARANA_READ_SSH_KEY is required for purama-smarana.'
            exit 1
          fi
      - name: Retrieve only manifest-listed private source files
        env:
          PURAMA_PACKAGES_READ_SSH_KEY: ${{ secrets.PURAMA_PACKAGES_READ_SSH_KEY }}
          TMPDIR: ${{ runner.temp }}/akasha-shared-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -m 700 -- "$TMPDIR"
          node scripts/install-private-dependencies.mjs --shared-source "$GITHUB_WORKSPACE/shared-source"
      - name: Remove and verify temporary source authentication
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const root = fs.realpathSync(process.env.RUNNER_TEMP);
          if (!/^\d+$/.test(process.env.GITHUB_RUN_ID) || !/^\d+$/.test(process.env.GITHUB_RUN_ATTEMPT)) throw new Error('Invalid owned cleanup identity.');
          const directory = path.join(root, `akasha-shared-source-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`);
          fs.rmSync(directory, { recursive: true, force: true });
          try {
            fs.lstatSync(directory);
            throw new Error('Temporary shared source authentication remains.');
          } catch (error) { if (error.code !== 'ENOENT') throw error; }
          const env = { ...process.env };
          for (const key of Object.keys(env)) if (key.startsWith('GIT_')) delete env[key];
          Object.assign(env, { GIT_CONFIG_NOSYSTEM: '1', GIT_CONFIG_GLOBAL: '/dev/null' });
          const result = spawnSync('git', ['-C', path.join(process.env.GITHUB_WORKSPACE, 'app'), 'config', '--local',
            '--no-includes', '--name-only', '--get-regexp',
            '^(core\\.sshcommand|http\\..*\\.extraheader|credential\\..*|url\\..*\\.insteadof|include\\.path|includeif\\..*\\.path)$'],
            { env, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], timeout: 5000, maxBuffer: 65536 });
          if (result.error || result.status !== 1 || result.stdout.trim()) throw new Error('Persistent checkout authentication remains or cannot be verified.');
          console.log(JSON.stringify({ sharedSourceTemporaryDirectoryAbsent: true, checkoutAuthenticationConfigAbsent: true }));
          NODE
      - name: Verify every source digest and create the sibling package layout
        run: node scripts/bootstrap-shared-packages.mjs "$GITHUB_WORKSPACE/shared-source" "$GITHUB_WORKSPACE/packages"
      - name: Install the locked dependencies with repository-scoped credentials
        env:
          SMARANA_READ_SSH_KEY: ${{ secrets.SMARANA_READ_SSH_KEY }}
          TMPDIR: ${{ runner.temp }}/akasha-private-install-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -m 700 -- "$TMPDIR"
          node scripts/install-private-dependencies.mjs
          git diff --exit-code -- package.json package-lock.json tooling/shared-packages.lock.json
      - name: Remove temporary private installation authentication
        if: always()
        run: |
          auth_dir="$RUNNER_TEMP/akasha-private-install-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$auth_dir"
          test ! -e "$auth_dir" && test ! -L "$auth_dir"
      - name: Run dependency lifecycle scripts without repository credentials
        run: |
          npm rebuild --no-audit --no-fund
          git diff --exit-code -- package.json package-lock.json
      - name: Run and verify every application regression result
        run: |
          npm test -- --reporter=json --outputFile="$RUNNER_TEMP/akasha-application-tests.json"
          node scripts/verify-vitest-receipt.mjs "$RUNNER_TEMP/akasha-application-tests.json"
      - name: Check webhook source guards and subscription allocations
        run: |
          node tests/stripe-webhook-idempotent-no-swallow.spec.cjs
          node node_modules/@playwright/test/cli.js test tests/v71-karma-split.spec.ts --workers=1 --output="$RUNNER_TEMP/akasha-karma-results"
      - name: Qualify journals, sharing and privacy on isolated PostgreSQL
        run: |
          status=0
          for suite in stripe entraide share email withdrawal; do
            python3 tests/stripe-webhook-recovery/native/run.py \
              --suite "$suite" --node-bin "$(command -v node)" \
              --driver "$PWD/node_modules/pg/lib/index.js" \
              --fixture-root "$RUNNER_TEMP/akasha-pg" \
              --output "$RUNNER_TEMP/akasha-native-results" || status=1
          done
          exit "$status"
      - name: Qualify share, shop, daily gifts and email confirmations on isolated PostgreSQL
        run: |
          python3 tests/delivery/run-native.py \
            --output "$RUNNER_TEMP/akasha-delivery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --port 54379
      - name: Verify contact replay and concurrent inserts on isolated PostgreSQL
        run: |
          CONTACT_PG_BIN="$(python3 - <<'PY_PG'
          import runpy
          native = runpy.run_path('tests/stripe-webhook-recovery/native/run.py', run_name='akasha_native_discovery')
          print(native['find_postgres'](None))
          PY_PG
          )"
          python3 tests/contact/native-idempotency.py \
            --pg-bin "$CONTACT_PG_BIN" \
            --output "$RUNNER_TEMP/akasha-contact-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Install the browser after private credentials have been removed
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Verify share popups and pending receipt recovery between Chromium tabs
        timeout-minutes: 5
        run: |
          status=0
          node tests/share-tracking/popup-browser.mjs || status="$?"
          node tests/delivery/pending-browser.cjs || status="$?"
          if [ -f evidence/native-pending-browser.json ]; then
            cat evidence/native-pending-browser.json
          fi
          exit "$status"
      - name: Qualify inherited reward boundaries on PostgreSQL
        run: |
          AKASHA_PG_BIN="$(python3 - <<'PY_PG'
          import runpy
          native = runpy.run_path('tests/stripe-webhook-recovery/native/run.py', run_name='akasha_native_discovery')
          print(native['find_postgres'](None))
          PY_PG
          )"
          python3 tests/reward-boundaries/native/run.py \
            --pg-bin-dir "$AKASHA_PG_BIN" \
            --evidence-dir "$RUNNER_TEMP/akasha-reward-results"
      - name: Verify dependency manifests stayed unchanged
        run: git diff --exit-code -- package.json package-lock.json tooling/shared-packages.lock.json
      - name: Generate route types and check the complete application TypeScript
        run: |
          node node_modules/next/dist/bin/next typegen
          node node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Lint Web application and test tooling with the canonical shared configuration
        run: npm run lint -- --config eslint.config.js .
      - name: Build Next with synthetic provider configuration
        env:
          # Synthetic values apply only to the build, never to application tests.
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-not-a-real-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-not-a-real-key
          UPSTASH_REDIS_REST_URL: https://redis.example.invalid
          UPSTASH_REDIS_REST_TOKEN: ci-redis-token-not-a-real-token
          STRIPE_SECRET_KEY: sk_test_synthetic_fixture_not_a_real_key
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          RESEND_API_KEY: ""
        run: npm run build
      - name: Verify the four public Cycles journeys on the compiled application
        timeout-minutes: 5
        run: |
          python3 tests/delivery/run-cycles.py \
            --output "$RUNNER_TEMP/akasha-cycles-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --port 3000
      - name: Verify contact recovery across real browser tabs on the compiled application
        timeout-minutes: 5
        env:
          # Use the installed Chrome path covered by Ubuntu's existing AppArmor profile.
          # The contact suite explicitly retains chromiumSandbox: true.
          CONTACT_BROWSER_EXECUTABLE: /opt/google/chrome/chrome
        run: |
          test -x "$CONTACT_BROWSER_EXECUTABLE"
          python3 tests/delivery/run-cycles.py \
            --suite contact \
            --output "$RUNNER_TEMP/akasha-contact-browser-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --port 3057
      - name: Preserve application and PostgreSQL qualification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: akasha-postgresql-receipts
          path: |
            ${{ runner.temp }}/akasha-application-tests.json
            ${{ runner.temp }}/akasha-reward-results
            ${{ runner.temp }}/akasha-delivery-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/akasha-native-results
            ${{ github.workspace }}/app/evidence/native-pending-browser.json
            ${{ github.workspace }}/app/tests/share-tracking/evidence/popup-browser.json
            ${{ runner.temp }}/akasha-cycles-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/akasha-contact-native-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/akasha-contact-browser-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
